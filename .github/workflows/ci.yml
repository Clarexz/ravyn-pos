name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, typecheck y pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build antes del typecheck: el servidor importa los paquetes del workspace ya compilados.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  package-windows:
    name: Instalador Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Armar paquete (servicio + interfaz + Node empaquetado)
        run: node scripts/package-windows.mjs
        env:
          NODE_VERSION: ${{ vars.NODE_VERSION || '22.12.0' }}
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Generar instalador
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\pos.iss
      - uses: actions/upload-artifact@v4
        with:
          name: pos-installer-win-x64
          path: installer/Output/*.exe
          if-no-files-found: error
